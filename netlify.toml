[build]
  publish = "files"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[functions."daily-feedwatch"]
  schedule = "0 11 * * *"

[functions."weekly-regulatory"]
  schedule = "0 12 * * 1"

[functions."fee-change-monitor"]
  schedule = "0 13 * * *"

[functions."update-feedwatch"]
  schedule = "0 12 * * *"

[functions."search"]
  included_files = []

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
