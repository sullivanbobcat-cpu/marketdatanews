[build]
  publish = "files"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[functions."daily-feedwatch"]
  schedule = "0 11 * * *"

[functions."weekly-regulatory"]
  schedule = "0 12 * * 1"

[functions."fee-change-monitor"]
  schedule = "0 13 * * *"

[functions."update-feedwatch"]
  schedule = "0 12 * * *"

[functions."daily-tweet"]
  schedule = "0 14 * * 1-5"

[functions."breaking-news-tweet"]
  schedule = "*/10 * * * *"

[functions."market-snapshot-tweet"]
  schedule = "30 14 * * 1-5"

[functions."deadline-countdown-tweet"]
  schedule = "0 13 * * *"

[functions."rule-filing-alert-tweet"]
  schedule = "*/15 13-21 * * 1-5"

[functions."weekly-fact-tweet"]
  schedule = "0 0 * * 0"

[functions."new-feedwatch-entry-tweet"]
  schedule = "0 * * * *"

[functions."monday-roundup-tweet"]
  schedule = "0 12 * * 1"

[functions."monthly-stats-tweet"]
  schedule = "0 13 1 * *"

[functions."prediction-market-pulse-tweet"]
  schedule = "0 12 * * 1-5"

[functions."update-prediction-markets"]
  schedule = "0 12 * * *"

[functions."crypto-pm-tweet"]
  schedule = "0 13,16,19 * * 1-5"

[functions."weekly-crypto-roundup-tweet"]
  schedule = "0 14 * * 0"

[functions."search"]
  included_files = []

[functions."stripe-webhook"]
  included_files = ["node_modules/stripe/**"]

[functions."fed-policy-tweet"]
  schedule = "0 13 * * 1-5"

[functions."prediction-markets-legislation-tweet"]
  schedule = "15 13 * * 1-5"

[functions."oil-markets-tweet"]
  schedule = "30 13 * * 1-5"

[functions."economic-data-tweet"]
  schedule = "45 13 * * 1-5"

[functions."cme-volume-tweet"]
  schedule = "0 14 * * 1-5"

[functions."cot-report-tweet"]
  schedule = "0 21 * * 5"

[functions."exchange-outage-tweet"]
  schedule = "*/10 12-22 * * 1-5"

[functions."sec-cftc-enforcement-tweet"]
  schedule = "15 14 * * 1-5"

[functions."treasury-yield-tweet"]
  schedule = "30 14 * * 1-5"

[functions."auto-discover-feedwatch"]
  schedule = "0 11 * * 1"

[functions."weekly-thread-tweet"]
  schedule = "0 14 * * 3"

[functions."daily-reply-digest"]
  schedule = "0 13 * * 1-5"

[[headers]]
  for = '/favicon.*'
  [headers.values]
    Cache-Control = 'public, max-age=86400'

[[headers]]
  for = '/apple-touch-icon.png'
  [headers.values]
    Cache-Control = 'public, max-age=86400'

[[headers]]
  for = '/icon-*.png'
  [headers.values]
    Cache-Control = 'public, max-age=86400'

[[headers]]
  for = '/site.webmanifest'
  [headers.values]
    Cache-Control = 'public, max-age=86400'
    Content-Type = 'application/manifest+json'

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
