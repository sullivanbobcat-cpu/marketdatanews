<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1500 500'>
  <!-- Background -->
  <rect width='1500' height='500' fill='#0d0d0d'/>

  <!-- Subtle grid pattern for depth -->
  <defs>
    <pattern id='grid' width='60' height='60' patternUnits='userSpaceOnUse'>
      <path d='M 60 0 L 0 0 0 60' fill='none' stroke='#1a1a1a' stroke-width='0.5'/>
    </pattern>
  </defs>
  <rect width='1500' height='500' fill='url(#grid)'/>

  <!-- Top gold accent stripe -->
  <rect x='0' y='0' width='1500' height='5' fill='#b8860b'/>

  <!-- Large decorative bar chart background right side -->
  <rect x='950' y='120' width='45' height='280' rx='3' fill='#b8860b' opacity='0.08'/>
  <rect x='1010' y='80' width='45' height='320' rx='3' fill='#b8860b' opacity='0.12'/>
  <rect x='1070' y='50' width='45' height='350' rx='3' fill='#b8860b' opacity='0.18'/>
  <rect x='1130' y='90' width='45' height='310' rx='3' fill='#b8860b' opacity='0.12'/>
  <rect x='1190' y='140' width='45' height='260' rx='3' fill='#b8860b' opacity='0.08'/>
  <rect x='1250' y='60' width='45' height='340' rx='3' fill='#b8860b' opacity='0.15'/>
  <rect x='1310' y='100' width='45' height='300' rx='3' fill='#b8860b' opacity='0.10'/>
  <rect x='1370' y='70' width='45' height='330' rx='3' fill='#b8860b' opacity='0.13'/>
  <rect x='1430' y='110' width='45' height='290' rx='3' fill='#b8860b' opacity='0.09'/>

  <!-- Logo mark -->
  <rect x='120' y='155' width='90' height='90' rx='8' fill='#0d0d0d' stroke='#b8860b' stroke-width='1.5'/>
  <rect x='132' y='210' width='14' height='28' rx='2' fill='#b8860b' opacity='0.5'/>
  <rect x='150' y='195' width='14' height='43' rx='2' fill='#b8860b' opacity='0.75'/>
  <rect x='168' y='178' width='14' height='60' rx='2' fill='#b8860b'/>
  <rect x='186' y='186' width='14' height='52' rx='2' fill='#b8860b' opacity='0.65'/>

  <!-- Main title -->
  <text x='230' y='210' font-family='Georgia,serif' font-size='62' font-weight='700' fill='#f5f2eb'>Market Data</text>
  <text x='230' y='275' font-family='Georgia,serif' font-size='62' font-weight='400' fill='#b8860b'>News</text>

  <!-- Tagline -->
  <text x='232' y='315' font-family='monospace' font-size='16' fill='#666' letter-spacing='3'>MARKET INFRASTRUCTURE INTELLIGENCE</text>

  <!-- Divider line -->
  <line x1='120' y1='345' x2='880' y2='345' stroke='#2a2a2a' stroke-width='1'/>

  <!-- Three stat pills -->
  <rect x='120' y='360' width='160' height='36' rx='18' fill='#1a1a1a' stroke='#2a2a2a' stroke-width='1'/>
  <text x='200' y='383' font-family='monospace' font-size='11' fill='#b8860b' text-anchor='middle'>45 FEEDS TRACKED</text>

  <rect x='294' y='360' width='180' height='36' rx='18' fill='#1a1a1a' stroke='#2a2a2a' stroke-width='1'/>
  <text x='384' y='383' font-family='monospace' font-size='11' fill='#b8860b' text-anchor='middle'>8 NMS PLANS</text>

  <rect x='488' y='360' width='200' height='36' rx='18' fill='#1a1a1a' stroke='#2a2a2a' stroke-width='1'/>
  <text x='588' y='383' font-family='monospace' font-size='11' fill='#b8860b' text-anchor='middle'>60+ EXCHANGES</text>

  <!-- URL -->
  <text x='120' y='440' font-family='monospace' font-size='18' fill='#b8860b' letter-spacing='1'>marketdatanews.com</text>

  <!-- Bottom ticker strip -->
  <rect x='0' y='460' width='1500' height='40' fill='#0a0a0a'/>
  <rect x='0' y='460' width='1500' height='1' fill='#2a2a2a'/>
  <text x='30' y='486' font-family='monospace' font-size='13' fill='#b8860b'>CRITICAL: CME iLink v8 Sunset — Apr 24, 2026</text>
  <text x='420' y='486' font-family='monospace' font-size='13' fill='#555'>·</text>
  <text x='440' y='486' font-family='monospace' font-size='13' fill='#666'>CME STP FIX Google Cloud — Apr 26, 2026</text>
  <text x='770' y='486' font-family='monospace' font-size='13' fill='#555'>·</text>
  <text x='790' y='486' font-family='monospace' font-size='13' fill='#666'>Rule 605 Amended Plan — Aug 1, 2026</text>
  <text x='1090' y='486' font-family='monospace' font-size='13' fill='#555'>·</text>
  <text x='1110' y='486' font-family='monospace' font-size='13' fill='#666'>Reg S-P Smaller RIA — Jun 3, 2026</text>
  <text x='1370' y='486' font-family='monospace' font-size='13' fill='#555'>·</text>
  <text x='1390' y='486' font-family='monospace' font-size='13' fill='#b8860b'>FREE</text>

  <!-- Bottom gold stripe -->
  <rect x='0' y='497' width='1500' height='3' fill='#b8860b'/>
</svg>
